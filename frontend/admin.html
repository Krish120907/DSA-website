<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - DSA Online Judge</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f5f7ff',
                            100: '#ebf0ff',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="assets/css/styles.css">
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen transition-colors duration-200" x-data="adminApp()">
    
    <!-- Navbar -->
    <nav class="border-b border-slate-800 bg-slate-900/50 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center">
                    <a href="index.html" class="text-xl font-extrabold bg-gradient-to-r from-blue-500 to-indigo-500 bg-clip-text text-transparent">
                        DSA Judge
                    </a>
                    <div class="hidden md:block ml-10 flex items-baseline space-x-4">
                        <a href="index.html" class="text-slate-300 hover:bg-slate-800 hover:text-white px-3 py-2 rounded-md text-sm font-medium transition-colors">Dashboard</a>
                        <a href="problems.html" class="text-slate-300 hover:bg-slate-800 hover:text-white px-3 py-2 rounded-md text-sm font-medium transition-colors">Problems</a>
                        <a href="leaderboard.html" class="text-slate-300 hover:bg-slate-800 hover:text-white px-3 py-2 rounded-md text-sm font-medium transition-colors">Leaderboard</a>
                        <a href="admin.html" class="bg-slate-800 text-white px-3 py-2 rounded-md text-sm font-medium">Admin</a>
                    </div>
                </div>
                <div class="flex items-center space-x-4">
                    <button @click="toggleTheme()" class="p-2 rounded-lg bg-slate-800 text-slate-300 hover:text-white focus:outline-none">
                        <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
                    </button>
                    <span class="text-sm font-semibold text-slate-300" x-text="user ? user.username : ''"></span>
                    <button @click="Auth.logout()" class="text-sm bg-red-600 hover:bg-red-500 px-3 py-1.5 rounded-lg font-semibold transition-colors">Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
        
        <div class="flex flex-col md:flex-row md:items-center md:justify-between mb-8">
            <div>
                <h1 class="text-3xl font-extrabold tracking-tight">Admin Console</h1>
                <p class="text-slate-400 mt-2">Create, modify, and delete problems or manage testing parameters.</p>
            </div>
            <div class="mt-4 md:mt-0">
                <button @click="openAddModal()" 
                        class="bg-blue-600 hover:bg-blue-500 text-white font-semibold px-4 py-2 rounded-xl transition-all shadow-lg text-sm flex items-center">
                    <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                    Add Problem
                </button>
            </div>
        </div>

        <!-- Problems list -->
        <div class="rounded-2xl border border-slate-800 bg-slate-900/40 overflow-hidden">
            <table class="min-w-full divide-y divide-slate-800">
                <thead class="bg-slate-900/60">
                    <tr>
                        <th class="px-6 py-4 text-left text-xs font-bold text-slate-400 uppercase tracking-wider w-16">ID</th>
                        <th class="px-6 py-4 text-left text-xs font-bold text-slate-400 uppercase tracking-wider">Title</th>
                        <th class="px-6 py-4 text-left text-xs font-bold text-slate-400 uppercase tracking-wider">Difficulty</th>
                        <th class="px-6 py-4 text-left text-xs font-bold text-slate-400 uppercase tracking-wider">Topic Tags</th>
                        <th class="px-6 py-4 text-left text-xs font-bold text-slate-400 uppercase tracking-wider">Status</th>
                        <th class="px-6 py-4 text-left text-xs font-bold text-slate-400 uppercase tracking-wider">Actions</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-slate-800/40">
                    <template x-for="prob in problems" :key="prob.id">
                        <tr class="hover:bg-slate-900/25 transition-colors">
                            <td class="px-6 py-4 text-sm font-semibold text-slate-400" x-text="prob.id"></td>
                            <td class="px-6 py-4 text-sm font-bold text-slate-100" x-text="prob.title"></td>
                            <td class="px-6 py-4 text-sm font-semibold">
                                <span class="px-2.5 py-0.5 rounded-full text-xs font-bold"
                                      :class="prob.difficulty === 'Easy' ? 'bg-green-500/10 text-green-400 border border-green-500/20' : 
                                              prob.difficulty === 'Medium' ? 'bg-yellow-500/10 text-yellow-400 border border-yellow-500/20' : 
                                              'bg-red-500/10 text-red-400 border border-red-500/20'"
                                      x-text="prob.difficulty"></span>
                            </td>
                            <td class="px-6 py-4 text-sm text-slate-300" x-text="prob.topic_tags"></td>
                            <td class="px-6 py-4 text-sm">
                                <template x-if="prob.approved == 1">
                                    <span class="px-2.5 py-0.5 rounded-full text-xs font-bold bg-green-500/10 text-green-400 border border-green-500/20">Approved</span>
                                </template>
                                <template x-if="prob.approved == 0">
                                    <span class="px-2.5 py-0.5 rounded-full text-xs font-bold bg-yellow-500/10 text-yellow-400 border border-yellow-500/20">Pending</span>
                                </template>
                            </td>
                            <td class="px-6 py-4 text-sm flex space-x-3">
                                <template x-if="prob.approved == 0">
                                    <button @click="approveProblem(prob.id)" 
                                            class="bg-green-600/10 hover:bg-green-600 hover:text-white border border-green-500/20 text-green-400 font-semibold px-3 py-1 rounded text-xs transition-all">
                                        Approve
                                    </button>
                                </template>
                                <button @click="deleteProblem(prob.id)" 
                                        class="bg-red-600/10 hover:bg-red-600 hover:text-white border border-red-500/20 text-red-400 font-semibold px-3 py-1 rounded text-xs transition-all">
                                    Delete
                                </button>
                            </td>
                        </tr>
                    </template>
                    <template x-if="problems.length === 0">
                        <tr>
                            <td colspan="6" class="px-6 py-10 text-center text-slate-500 text-sm">No problems exist. Create one using the button above.</td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>

        <!-- Add Problem Modal -->
        <div x-show="showModal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/80 backdrop-blur-sm p-4 overflow-y-auto" x-transition>
            <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-2xl w-full p-8 relative shadow-2xl overflow-y-auto max-h-[90vh]">
                <h2 class="text-2xl font-bold mb-6 text-slate-100">Add New DSA Problem</h2>
                
                <form @submit.prevent="submitProblem">
                    <!-- Title -->
                    <div class="mb-4">
                        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Problem Title</label>
                        <input type="text" x-model="form.title" required
                               class="w-full bg-slate-950 border border-slate-800 rounded-xl py-2 px-3 text-sm text-slate-100 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>

                    <!-- Grid for Difficulty & Tags -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Difficulty</label>
                            <select x-model="form.difficulty" required
                                    class="w-full bg-slate-950 border border-slate-800 rounded-xl py-2 px-3 text-sm text-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500">
                                <option value="Easy">Easy</option>
                                <option value="Medium">Medium</option>
                                <option value="Hard">Hard</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Topic Tags (Comma Separated)</label>
                            <input type="text" x-model="form.topic_tags" placeholder="e.g. Arrays, Sorting, Hash Map" required
                                   class="w-full bg-slate-950 border border-slate-800 rounded-xl py-2 px-3 text-sm text-slate-100 focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                    </div>

                    <!-- Description -->
                    <div class="mb-4">
                        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Problem Description (Markdown supported)</label>
                        <textarea x-model="form.description" rows="5" required
                                  class="w-full bg-slate-950 border border-slate-800 rounded-xl py-2 px-3 text-sm text-slate-100 focus:outline-none focus:ring-2 focus:ring-blue-500 font-mono"></textarea>
                    </div>

                    <!-- Constraints -->
                    <div class="mb-4">
                        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Constraints</label>
                        <textarea x-model="form.constraints" rows="3" required
                                  class="w-full bg-slate-950 border border-slate-800 rounded-xl py-2 px-3 text-sm text-slate-100 focus:outline-none focus:ring-2 focus:ring-blue-500 font-mono" placeholder="e.g. - 1 <= nums.length <= 10^5"></textarea>
                    </div>

                    <!-- Test Case Setup (Sample) -->
                    <div class="mb-6 border-t border-slate-800 pt-4">
                        <h3 class="text-sm font-bold text-slate-300 mb-3">Test Case Configuration</h3>
                        
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                            <div>
                                <label class="block text-xs font-semibold text-slate-500 mb-1">Sample Input</label>
                                <textarea x-model="sampleTC.input" rows="2" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs font-mono"></textarea>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-500 mb-1">Sample Expected Output</label>
                                <textarea x-model="sampleTC.expected" rows="2" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs font-mono"></textarea>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-semibold text-slate-500 mb-1">Hidden Input</label>
                                <textarea x-model="hiddenTC.input" rows="2" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs font-mono"></textarea>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-500 mb-1">Hidden Expected Output</label>
                                <textarea x-model="hiddenTC.expected" rows="2" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs font-mono"></textarea>
                            </div>
                        </div>
                    </div>

                    <!-- Actions -->
                    <div class="flex justify-end space-x-3 border-t border-slate-800 pt-4">
                        <button type="button" @click="showModal = false"
                                class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold py-2 px-4 rounded-xl text-sm transition-all">
                            Cancel
                        </button>
                        <button type="submit" 
                                class="bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2 px-4 rounded-xl text-sm transition-all shadow-lg">
                            Create Problem
                        </button>
                    </div>
                </form>
            </div>
        </div>

    </main>

    <script src="assets/js/app.js"></script>
    <script src="assets/js/auth.js"></script>
    <script>
        function adminApp() {
            return {
                user: null,
                problems: [],
                showModal: false,
                form: {
                    title: '',
                    difficulty: 'Easy',
                    topic_tags: '',
                    description: '',
                    constraints: ''
                },
                sampleTC: { input: '', expected: '' },
                hiddenTC: { input: '', expected: '' },

                init() {
                    Auth.checkAuthGuard();
                    this.user = Auth.getUser();
                    
                    if (this.user.role !== 'admin') {
                        window.location.href = 'index.html';
                        return;
                    }

                    this.fetchProblems();
                },

                async fetchProblems() {
                    try {
                        const response = await fetch(`${API_BASE_URL}/admin/problems`, {
                            headers: Auth.getAuthHeader()
                        });
                        if (response.ok) {
                            this.problems = await response.json();
                        }
                    } catch (e) {
                        console.error('Error fetching problems list', e);
                    }
                },

                openAddModal() {
                    this.form = { title: '', difficulty: 'Easy', topic_tags: '', description: '', constraints: '' };
                    this.sampleTC = { input: '', expected: '' };
                    this.hiddenTC = { input: '', expected: '' };
                    this.showModal = true;
                },

                async submitProblem() {
                    // Bundle problem details + test cases
                    const payload = {
                        ...this.form,
                        test_cases: [
                            { input: this.sampleTC.input, expected: this.sampleTC.expected, is_sample: 1 },
                            { input: this.hiddenTC.input, expected: this.hiddenTC.expected, is_sample: 0 }
                        ]
                    };

                    try {
                        const response = await fetch(`${API_BASE_URL}/admin/problems`, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                ...Auth.getAuthHeader()
                            },
                            body: JSON.stringify(payload)
                        });

                        if (response.ok) {
                            this.showModal = false;
                            this.fetchProblems();
                        } else {
                            const errData = await response.json();
                            alert(errData.message || 'Failed to create problem.');
                        }
                    } catch (e) {
                        console.error(e);
                    }
                },

                async approveProblem(id) {
                    if (!confirm('Are you sure you want to approve this problem?')) return;

                    try {
                        const response = await fetch(`${API_BASE_URL}/admin/problems/${id}/approve`, {
                            method: 'POST',
                            headers: Auth.getAuthHeader()
                        });

                        if (response.ok) {
                            alert('Problem approved successfully!');
                            this.fetchProblems();
                        } else {
                            const errData = await response.json();
                            alert(errData.message || 'Failed to approve problem.');
                        }
                    } catch (e) {
                        console.error(e);
                        alert('An error occurred during approval: ' + e.message);
                    }
                },

                async deleteProblem(id) {
                    if (!confirm('Are you sure you want to delete this problem?')) return;

                    try {
                        const response = await fetch(`${API_BASE_URL}/admin/problems/${id}`, {
                            method: 'DELETE',
                            headers: Auth.getAuthHeader()
                        });

                        if (response.ok) {
                            this.fetchProblems();
                        } else {
                            const errData = await response.json();
                            alert(errData.message || 'Failed to delete problem.');
                        }
                    } catch (e) {
                        console.error(e);
                        alert('An error occurred during deletion: ' + e.message);
                    }
                }
            }
        }
    </script>
</body>
</html>
