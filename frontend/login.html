<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - DSA Online Judge</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f5f7ff',
                            100: '#ebf0ff',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="assets/css/styles.css">
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen flex items-center justify-center transition-colors duration-200">
    <div class="absolute inset-0 bg-[radial-gradient(circle_at_30%_20%,rgba(59,130,246,0.1),transparent_40%),radial-gradient(circle_at_70%_80%,rgba(139,92,246,0.08),transparent_50%)] pointer-events-none"></div>

    <div x-data="loginForm()" class="w-full max-w-md p-8 rounded-2xl shadow-xl glass-panel-dark relative z-10">
        <!-- Logo/Header -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-extrabold tracking-tight bg-gradient-to-r from-blue-500 to-indigo-500 bg-clip-text text-transparent">
                DSA Judge
            </h1>
            <p class="text-slate-400 mt-2" x-text="isRegister ? 'Create an account to start coding' : 'Welcome back, coder!'"></p>
        </div>

        <!-- Alert Notification -->
        <div x-show="alert.show" x-transition class="mb-4 p-3 rounded-lg text-sm font-medium"
             :class="alert.type === 'error' ? 'bg-red-500/10 text-red-400 border border-red-500/20' : 'bg-green-500/10 text-green-400 border border-green-500/20'">
            <span x-text="alert.message"></span>
        </div>

        <!-- Form -->
        <form @submit.prevent="submitForm">
            <!-- Username (Registration only) -->
            <div class="mb-4" x-show="isRegister">
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Username</label>
                <input type="text" x-model="formData.username" 
                       class="w-full bg-slate-900 border border-slate-800 rounded-xl py-3 px-4 text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all">
            </div>

            <!-- Email -->
            <div class="mb-4">
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Email Address</label>
                <input type="email" x-model="formData.email" required
                       class="w-full bg-slate-900 border border-slate-800 rounded-xl py-3 px-4 text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all">
            </div>

            <!-- Password -->
            <div class="mb-6">
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Password</label>
                <input type="password" x-model="formData.password" required
                       class="w-full bg-slate-900 border border-slate-800 rounded-xl py-3 px-4 text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all">
            </div>

            <!-- Submit Button -->
            <button type="submit" 
                    class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-semibold py-3 px-4 rounded-xl shadow-lg transition-all focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 focus:ring-offset-slate-950"
                    :disabled="loading">
                <span x-show="!loading" x-text="isRegister ? 'Sign Up' : 'Sign In'"></span>
                <span x-show="loading">Processing...</span>
            </button>
        </form>

        <!-- Toggle Auth mode -->
        <div class="text-center mt-6">
            <button @click="toggleMode" class="text-sm text-slate-400 hover:text-white transition-colors">
                <span x-text="isRegister ? 'Already have an account? Sign In' : 'New here? Create an account'"></span>
            </button>
        </div>
    </div>

    <script src="assets/js/app.js"></script>
    <script src="assets/js/auth.js"></script>
    <script>
        function loginForm() {
            return {
                isRegister: false,
                loading: false,
                formData: {
                    username: '',
                    email: '',
                    password: ''
                },
                alert: {
                    show: false,
                    type: 'error',
                    message: ''
                },
                toggleMode() {
                    this.isRegister = !this.isRegister;
                    this.alert.show = false;
                },
                async submitForm() {
                    this.loading = true;
                    this.alert.show = false;

                    const endpoint = this.isRegister ? '/auth/register' : '/auth/login';
                    const payload = this.isRegister 
                        ? this.formData 
                        : { email: this.formData.email, password: this.formData.password };

                    try {
                        const response = await fetch(`${API_BASE_URL}${endpoint}`, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify(payload)
                        });

                        const resData = await response.json();

                        if (!response.ok) {
                            throw new Error(resData.message || 'Authentication failed');
                        }

                        if (this.isRegister) {
                            this.alert.show = true;
                            this.alert.type = 'success';
                            this.alert.message = 'Registration successful! You can now login.';
                            this.isRegister = false;
                            this.formData.password = '';
                        } else {
                            Auth.setToken(resData.token);
                            window.location.href = 'index.html';
                        }
                    } catch (err) {
                        this.alert.show = true;
                        this.alert.type = 'error';
                        this.alert.message = err.message;
                    } finally {
                        this.loading = false;
                    }
                }
            }
        }
    </script>
</body>
</html>
