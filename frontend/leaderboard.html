<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard - DSA Online Judge</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f5f7ff',
                            100: '#ebf0ff',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="assets/css/styles.css">
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen transition-colors duration-200" x-data="leaderboardApp()">
    
    <!-- Navbar -->
    <nav class="border-b border-slate-800 bg-slate-900/50 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center">
                    <a href="index.html" class="text-xl font-extrabold bg-gradient-to-r from-blue-500 to-indigo-500 bg-clip-text text-transparent">
                        DSA Judge
                    </a>
                    <div class="hidden md:block ml-10 flex items-baseline space-x-4">
                        <a href="index.html" class="text-slate-300 hover:bg-slate-800 hover:text-white px-3 py-2 rounded-md text-sm font-medium transition-colors">Dashboard</a>
                        <a href="problems.html" class="text-slate-300 hover:bg-slate-800 hover:text-white px-3 py-2 rounded-md text-sm font-medium transition-colors">Problems</a>
                        <a href="leaderboard.html" class="bg-slate-800 text-white px-3 py-2 rounded-md text-sm font-medium">Leaderboard</a>
                        <template x-if="user && user.role === 'admin'">
                            <a href="admin.html" class="text-slate-300 hover:bg-slate-800 hover:text-white px-3 py-2 rounded-md text-sm font-medium transition-colors">Admin</a>
                        </template>
                    </div>
                </div>
                <div class="flex items-center space-x-4">
                    <button @click="toggleTheme()" class="p-2 rounded-lg bg-slate-800 text-slate-300 hover:text-white focus:outline-none">
                        <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
                    </button>
                    <span class="text-sm font-semibold text-slate-300" x-text="user ? user.username : ''"></span>
                    <button @click="Auth.logout()" class="text-sm bg-red-600 hover:bg-red-500 px-3 py-1.5 rounded-lg font-semibold transition-colors">Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
        
        <div class="mb-8">
            <h1 class="text-3xl font-extrabold tracking-tight">Global Leaderboard</h1>
            <p class="text-slate-400 mt-2">See who is at the top of the ranks and keep coding to rise.</p>
        </div>

        <!-- Leaderboard Table -->
        <div class="rounded-2xl border border-slate-800 bg-slate-900/40 overflow-hidden">
            <table class="min-w-full divide-y divide-slate-800">
                <thead class="bg-slate-900/60">
                    <tr>
                        <th class="px-6 py-4 text-left text-xs font-bold text-slate-400 uppercase tracking-wider w-20">Rank</th>
                        <th class="px-6 py-4 text-left text-xs font-bold text-slate-400 uppercase tracking-wider">Username</th>
                        <th class="px-6 py-4 text-left text-xs font-bold text-slate-400 uppercase tracking-wider">Role</th>
                        <th class="px-6 py-4 text-left text-xs font-bold text-slate-400 uppercase tracking-wider">Streak</th>
                        <th class="px-6 py-4 text-left text-xs font-bold text-slate-400 uppercase tracking-wider">Problems Solved</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-slate-800/40">
                    <template x-for="(row, idx) in leaderboard" :key="row.id">
                        <tr class="hover:bg-slate-900/25 transition-colors"
                            :class="user && user.id === row.id ? 'bg-blue-500/5' : ''">
                            <td class="px-6 py-4 text-sm font-bold text-slate-100">
                                <span x-show="idx === 0" class="text-yellow-500 text-lg">👑 1</span>
                                <span x-show="idx === 1" class="text-slate-300 text-lg font-bold">🥈 2</span>
                                <span x-show="idx === 2" class="text-amber-600 text-lg font-bold">🥉 3</span>
                                <span x-show="idx > 2" x-text="idx + 1"></span>
                            </td>
                            <td class="px-6 py-4 text-sm font-bold text-slate-100" x-text="row.username"></td>
                            <td class="px-6 py-4 text-sm font-semibold">
                                <span class="px-2.5 py-0.5 rounded-full text-xs font-bold"
                                      :class="row.role === 'admin' ? 'bg-red-500/10 text-red-400 border border-red-500/20' : 'bg-slate-800 text-slate-400 border border-slate-700'"
                                      x-text="row.role"></span>
                            </td>
                            <td class="px-6 py-4 text-sm text-slate-300 font-bold">
                                <span class="text-orange-500">🔥 <span x-text="row.streak_count"></span> days</span>
                            </td>
                            <td class="px-6 py-4 text-sm text-slate-300">
                                <span class="bg-blue-600/10 text-blue-400 font-bold px-3 py-1 rounded-lg text-xs" x-text="row.solved_count"></span>
                            </td>
                        </tr>
                    </template>
                    <template x-if="leaderboard.length === 0">
                        <tr>
                            <td colspan="5" class="px-6 py-10 text-center text-slate-500 text-sm">No coders on the leaderboard yet.</td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>

    </main>

    <script src="assets/js/app.js"></script>
    <script src="assets/js/auth.js"></script>
    <script>
        function leaderboardApp() {
            return {
                user: null,
                leaderboard: [],

                init() {
                    Auth.checkAuthGuard();
                    this.user = Auth.getUser();
                    this.fetchLeaderboard();
                },

                async fetchLeaderboard() {
                    try {
                        const response = await fetch(`${API_BASE_URL}/leaderboard`, {
                            headers: Auth.getAuthHeader()
                        });
                        if (response.ok) {
                            this.leaderboard = await response.json();
                        }
                    } catch (e) {
                        console.error('Error fetching leaderboard', e);
                    }
                }
            }
        }
    </script>
</body>
</html>
